fullnameOverride: qezhet-am

image:
  repository: code4romania/armenia-service-map-backend
  tag: 1.0.0

ingress:
  enabled: true
  annotations:
    "cert-manager.io/cluster-issuer": letsencrypt
    "nginx.ingress.kubernetes.io/proxy-body-size": "10m"
  hosts:
    - host: qezhet.am
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls:
    - secretName: web-ssl
      hosts:
        - api.qezhet.am

service:
  port: 3000

livenessProbe: null
readinessProbe: null

resources:
  requests:
    memory: 128Mi
  limits:
    memory: 256Mi

env:
  - name: NODE_ENV
    value: "production"
  - name: CORS_ORIGIN
    value: "https://www.qezhet.am"
  - name: DATABASE_URL
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: DATABASE_URL

  - name: JWT_ACCESS_EXPIRATION
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: JWT_ACCESS_EXPIRATION
  - name: JWT_ACCESS_SECRET
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: JWT_ACCESS_SECRET
  - name: JWT_REFRESH_EXPIRATION
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: JWT_REFRESH_EXPIRATION
  - name: JWT_REFRESH_SECRET
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: JWT_REFRESH_SECRET

  - name: MAIL_FROM_ADDRESS
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: MAIL_FROM_ADDRESS

  - name: S3_ACCESS_KEY
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: S3_ACCESS_KEY
  - name: S3_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: S3_SECRET_KEY
  - name: S3_REGION
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: S3_REGION
  - name: S3_BUCKET
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: S3_BUCKET
  - name: S3_ENDPOINT
    valueFrom:
      secretKeyRef:
        name: qezhet-am-secret
        key: S3_ENDPOINT

  - name: UPLOAD_MAX_DOCUMENT_BYTES
    value: "10485760"
  - name: UPLOAD_MAX_IMAGE_BYTES
    value: "5242880"
