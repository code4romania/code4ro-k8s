fullnameOverride: "vm-stack"

kube-state-metrics:
  metricLabelsAllowlist:
    - pods=[*]
    - deployments=[app.kubernetes.io/name,app.kubernetes.io/component,app.kubernetes.io/instance]

vmsingle:
  spec:
    retentionPeriod: "1"
    extraArgs:
      maxLabelsPerTimeseries: "40"
    resources:
      requests:
        cpu: 150m
        memory: 1280Mi
      limits:
        memory: 2560Mi

vmagent:
  spec:
    resources:
      requests:
        cpu: 100m
        memory: 200Mi
      limits:
        memory: 400M

vlsingle:
  enabled: true
  spec:
    retentionPeriod: "30d"
    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        cpu: 1200m
        memory: 1500Mi
    storage:
      resources:
        requests:
          storage: 5Gi

vlagent:
  enabled: true
  spec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

prometheus-node-exporter:
  tolerations:
    - effect: NoExecute
      key: CriticalAddonsOnly
      operator: Exists

kubeControllerManager:
  enabled: false
coreDns:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
alertmanager:
  spec:
    configSecret: "alertmanager-config"

defaultRules:
  groups:
    general:
      create: false
    kubernetes-system-controller-manager:
      enabled: false
    kubernetes-system-scheduler:
      enabled: false

defaultDashboards:
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true

grafana:
  sidecar:
    dashboards:
      searchNamespace: ALL
    resources:
      requests:
        memory: 100Mi
      limits:
        memory: 150Mi
  vmScrape:
    enabled: false
  admin:
    existingSecret: grafana-secret
  envFromSecret: grafana-secret
  persistence:
    enabled: true
  resources:
    requests:
      memory: 384Mi
    limits:
      memory: 768Mi
  plugins:
    - victoriametrics-logs-datasource@0.30.1
  deploymentStrategy:
    type: Recreate
  ingress:
    enabled: true
    ingressClassName: tailscale
    hosts:
      - grafana
    tls:
      - hosts:
          - grafana

  grafana.ini:
    server:
      domain: grafana.serval-mark.ts.net
      root_url: https://grafana.serval-mark.ts.net
    users:
      allow_sign_up: false
      allow_org_create: false
    log:
      mode: console
      level: error
    auth.google:
      enabled: true
      client_id: 578670592407-0r9vnq4l6r6ck8jpo1gthohfq520rgt7.apps.googleusercontent.com
      client_secret: ${google-client-secret}
      allowed_domains: code4.ro commitglobal.org

  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: Code4Ro Slack
          receivers:
            - uid: XTCAjgR4z
              type: slack
              settings:
                url: ${slack-webhook}
